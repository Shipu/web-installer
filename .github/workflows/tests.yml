name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['4', '5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-filament${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-filament${{ matrix.filament }}-

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            "filament/forms:^${{ matrix.filament }}.0" \
            "filament/notifications:^${{ matrix.filament }}.0" \
            "filament/schemas:^${{ matrix.filament }}.0" \
            "filament/support:^${{ matrix.filament }}.0"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E '^(filament/schemas|livewire/livewire|laravel/framework|pestphp/pest) '

      - name: Run tests
        run: vendor/bin/pest
